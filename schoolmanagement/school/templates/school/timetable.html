{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Timetable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <h2 class="mb-4">Your Timetable</h2>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Subject</th>
                    <th>Room</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in timetable_entries %}
                    <tr>
                        <td>{{ entry.day }}</td>
                        <td>{{ entry.start_time }} - {{ entry.end_time }}</td>
                        <td>{{ entry.subject }}</td>
                        <td>{{ entry.room.name }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4">No timetable entries found.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{% url 'export_timetable' %}" class="btn btn-outline-secondary">
            <i class="fas fa-download"></i> Export Timetable
        </a>

        <a href="{% url 'lecturer_dashboard' %}" class="btn btn-secondary ms-2">Back to Dashboard</a>
    </div>
</body>
</html>
